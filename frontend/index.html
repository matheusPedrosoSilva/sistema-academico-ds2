<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Acadêmico DS II</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/model/aluno-model.js" defer></script>
    <script src="./js/view/aluno-view.js" defer></script>
    <script src="./js/controller/aluno-controller.js" defer></script>
    <script src="./js/service/aluno-service.js" defer></script>
</head>
<body>
    <header class="cabecalho">
        <div>
            <h1>Sistema Acadêmico DS II</h1>
            <p>v0.2 - Cadastro de alunos com DOM e eventos</p>
        </div>
    </header>
    <main class="container">
        <section class="cartao">
            <h2>Cadastro de Aluno</h2>
            <p>Preencha os campos abaixo para cadastrar um aluno</p>
            <form id="form-aluno" novalidate>
                <div class="gradde-formulario">
                    <div class="campo">
                        <label for="ra">RA</label>
                        <input type="text" id="ra" name="ra" placeholder="2026001" required></input>
                    </div>
                    <div class="campo">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" name="nome" placeholder="Nome Completo" required></input>
                    </div>
                    <div class="campo">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="aluno@email.com" required></input>
                    </div>
                    <div class="campo">
                        <label for="curso">Curso</label>
                        <input type="text" id="curso" name="curso" placeholder="Curso" required></input>
                    </div>
                    <div class="campo">
                        <label for="turma">Turma</label>
                        <input type="text" id="turma" name="turma" placeholder="Turma" required></input>
                    </div>
                    <div class="acoes-formulario">
                        <button type="submit" id="botao-salvar">Cadastrar aluno</button>
                    </div>
                </div>
            </form>
            <div id="mensagem" class="mensagem" role="status" aria-live="polite">
            </div>
        </section>
        <section class="cartao">
            <div class="titulo-secao">
                <h2>Alunos cadastrados</h2>
                <p id="total-alunos">Total: 0</p>
                
            <div class="tabela-responsiva">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>RA</th>
                                <th>Nome</th>
                                <th>E-mail</th>
                                <th>Cursp</th>
                                <th>Turma</th>
                                <th>Situação</th>
                            </tr>
                        </thead>
                        <tbody id="corpo-tabela-alunos"></tbody>
                    </table>
                </div>
            </div>
        </section>
        <section class="cartao">
            <h2>Representação em JSON</h2>
            <p>A lista abaixo é atualizada após cada cadastro</p>
            <pre id="saida-json">[]</pre>
        </section>
    </main>
</body>
</html>
